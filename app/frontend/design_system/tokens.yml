          active:    color-mix(in oklab, var(--color-ui-300), var(--color-ui-500) 40%)
          select:    color-mix(in oklab, var(--color-ui-300), var(--color-ui-accent-600) 40%)
          highlight: var(--color-ui-accent-600)
        dark:
          _base_:    var(--color-ui-700)
          hover:     color-mix(in oklab, var(--color-ui-700), var(--color-ui-500) 20%)
          active:    color-mix(in oklab, var(--color-ui-700), var(--color-ui-500) 40%)
          select:    color-mix(in oklab, var(--color-ui-700), var(--color-ui-accent-500) 40%)
