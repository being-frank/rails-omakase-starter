          hover:     var(--color-ui-700)
          focus:     var(--color-ui-accent-500)
          select:    var(--color-ui-accent-700)
          highlight: var(--color-ui-accent-500)

      subtle:
        light:
          _base_:    var(--color-ui-300)
          hover:     var(--color-ui-400)
          focus:     var(--color-ui-accent-600)
          select:    var(--color-ui-accent-400)
          highlight: var(--color-ui-accent-600)
        dark:
          _base_:    var(--color-ui-700)
          hover:     var(--color-ui-600)
          focus:     var(--color-ui-accent-500)
          select:    var(--color-ui-accent-700)
          highlight: var(--color-ui-accent-500)

      bold:
