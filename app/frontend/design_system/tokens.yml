      600: var(--color-lime-600)
      700: var(--color-lime-700)
      800: var(--color-lime-800)
      900: var(--color-lime-900)
      950: var(--color-lime-950)

    warning:
      50:  var(--color-amber-50)
      100: var(--color-amber-100)
      200: var(--color-amber-200)
      300: var(--color-amber-300)
      400: var(--color-amber-400)
      500: var(--color-amber-500)
      600: var(--color-amber-600)
      700: var(--color-amber-700)
      800: var(--color-amber-800)
      900: var(--color-amber-900)
      950: var(--color-amber-950)

semantic_colors:
  bg:
    ui:
      surface:
        light:
          _base_:    var(--color-ui-0)
          hover:     color-mix(in oklab, var(--color-ui-0), var(--color-ui-200) 20%)
          active:    color-mix(in oklab, var(--color-ui-0), var(--color-ui-200) 40%)
          select:    color-mix(in oklab, var(--color-ui-0), var(--color-ui-accent-600) 40%)
          highlight: var(--color-ui-accent-600)
        dark:
          _base_:    var(--color-ui-950)
          hover:     color-mix(in oklab, var(--color-ui-950), var(--color-ui-800) 20%)
          active:    color-mix(in oklab, var(--color-ui-950), var(--color-ui-800) 40%)
          select:    color-mix(in oklab, var(--color-ui-950), var(--color-ui-accent-500) 40%)
          highlight: var(--color-ui-accent-500)

      minimal:
        light:
          _base_:    var(--color-ui-100)
          hover:     color-mix(in oklab, var(--color-ui-100), var(--color-ui-300) 20%)
          active:    color-mix(in oklab, var(--color-ui-100), var(--color-ui-300) 40%)
          select:    color-mix(in oklab, var(--color-ui-100), var(--color-ui-accent-600) 40%)
          highlight: var(--color-ui-accent-600)
        dark:
          _base_:    var(--color-ui-900)
          hover:     color-mix(in oklab, var(--color-ui-900), var(--color-ui-700) 20%)
          active:    color-mix(in oklab, var(--color-ui-900), var(--color-ui-700) 40%)
          select:    color-mix(in oklab, var(--color-ui-900), var(--color-ui-accent-500) 40%)
          highlight: var(--color-ui-accent-500)

      muted:
