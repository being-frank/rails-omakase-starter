          hover:     color-mix(in oklab, var(--color-ui-200), var(--color-ui-400) 20%)
          active:    color-mix(in oklab, var(--color-ui-200), var(--color-ui-400) 40%)
          select:    color-mix(in oklab, var(--color-ui-200), var(--color-ui-accent-600) 40%)
          highlight: var(--color-ui-accent-600)
        dark:
          _base_:    var(--color-ui-800)
          hover:     color-mix(in oklab, var(--color-ui-800), var(--color-ui-600) 20%)
