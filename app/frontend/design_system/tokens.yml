semantic_spacing:
  spaces:
    1:  0.125rem # 2px
    2:  0.25rem  # 4px
    3:  0.5rem   # 8px
    4:  0.75rem  # 12px
    5:  1rem     # 16px
    6:  1.5rem   # 24px
    7:  2rem     # 32px
    8:  2.5rem   # 40px
    9:  3rem     # 48px
    10: 4rem     # 64px
    11: 5rem     # 80px
    12: 6rem     # 96px
    13: 10rem    # 160px
