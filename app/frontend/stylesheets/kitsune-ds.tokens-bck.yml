prefix: kds

formats:
  token:
    DEFAULT: prefix.set.namespace.component.category.property.variant.scale.state.mode

    primitive:
      DEFAULT: category.variant.scale
      spacing: category.scale

    semantic:
      DEFAULT: prefix.category.property.variant.scale.state.mode

  css_variable:
    primitive:
      DEFAULT: category.variant.scale

    semantic:
      DEFAULT: property.variant.scale.state

  css_class:
    DEFAULT: property.variant.scale.state
    color:
      text: property.variant

primitive:
  color:
    ui:
      0:   var(--color-white)
      50:  var(--color-gray-50)
      100: var(--color-gray-100)
      200: var(--color-gray-200)
      300: var(--color-gray-300)
      400: var(--color-gray-400)
      500: var(--color-gray-500)
      600: var(--color-gray-600)
      700: var(--color-gray-700)
      800: var(--color-gray-800)
      900: var(--color-gray-900)
      950: var(--color-gray-950)

    ui-accent:
      50:  var(--color-blue-50)
      100: var(--color-blue-100)
      200: var(--color-blue-200)
      300: var(--color-blue-300)
      400: var(--color-blue-400)
      500: var(--color-blue-500)
      600: var(--color-blue-600)
      700: var(--color-blue-700)
      800: var(--color-blue-800)
      900: var(--color-blue-900)
      950: var(--color-blue-950)

    success:
      50:  var(--color-lime-50)
      100: var(--color-lime-100)
      200: var(--color-lime-200)
      300: var(--color-lime-300)
      400: var(--color-lime-400)
      500: var(--color-lime-500)
      600: var(--color-lime-600)
      700: var(--color-lime-700)
      800: var(--color-lime-800)
      900: var(--color-lime-900)
      950: var(--color-lime-950)

    notice:
      50:  var(--color-blue-50)
      100: var(--color-blue-100)
      200: var(--color-blue-200)
      300: var(--color-blue-300)
      400: var(--color-blue-400)
      500: var(--color-blue-500)
      600: var(--color-blue-600)
      700: var(--color-blue-700)
      800: var(--color-blue-800)
      900: var(--color-blue-900)
      950: var(--color-blue-950)

    warning:
      50:  var(--color-amber-50)
      100: var(--color-amber-100)
      200: var(--color-amber-200)
      300: var(--color-amber-300)
      400: var(--color-amber-400)
      500: var(--color-amber-500)
      600: var(--color-amber-600)
      700: var(--color-amber-700)
      800: var(--color-amber-800)
      900: var(--color-amber-900)
      950: var(--color-amber-950)

    danger:
      50:  var(--color-rose-50)
      100: var(--color-rose-100)
      200: var(--color-rose-200)
      300: var(--color-rose-300)
      400: var(--color-rose-400)
      500: var(--color-rose-500)
      600: var(--color-rose-600)
      700: var(--color-rose-700)
      800: var(--color-rose-800)
      900: var(--color-rose-900)
      950: var(--color-rose-950)

  spacing:
    '*': initial
    2:   0.125rem
    4:   0.25rem
    8:   0.5rem
    12:  0.75rem
    16:  1rem
    24:  1.5rem
    32:  2rem
    40:  2.5rem
    48:  3rem
    64:  4rem
    80:  5rem
    96:  6rem
    112: 7rem
    128: 8rem

semantic:
  color:
    bg:
      ui:
        surface:
          light:
            DEFAULT:   var(--color-ui-0)
            hover:     color-mix(in oklch, var(--color-ui-0), var(--color-ui-200) 20%)
            active:    color-mix(in oklch, var(--color-ui-0), var(--color-ui-200) 40%)
            select:    color-mix(in oklch, var(--color-ui-0), var(--color-ui-accent-600) 40%)
            highlight: var(--color-ui-accent-600)
          dark:
            DEFAULT:   var(--color-ui-950)
            hover:     color-mix(in oklch, var(--color-ui-950), var(--color-ui-800) 20%)
            active:    color-mix(in oklch, var(--color-ui-950), var(--color-ui-800) 40%)
            select:    color-mix(in oklch, var(--color-ui-950), var(--color-ui-accent-500) 40%)
            highlight: var(--color-ui-accent-500)

        minimal:
          light:
            DEFAULT:   var(--color-ui-100)
            hover:     color-mix(in oklch, var(--color-ui-100), var(--color-ui-300) 20%)
            active:    color-mix(in oklch, var(--color-ui-100), var(--color-ui-300) 40%)
            select:    color-mix(in oklch, var(--color-ui-100), var(--color-ui-accent-600) 40%)
            highlight: var(--color-ui-accent-600)
          dark:
            DEFAULT:   var(--color-ui-900)
            hover:     color-mix(in oklch, var(--color-ui-900), var(--color-ui-700) 20%)
            active:    color-mix(in oklch, var(--color-ui-900), var(--color-ui-700) 40%)
            select:    color-mix(in oklch, var(--color-ui-900), var(--color-ui-accent-500) 40%)
            highlight: var(--color-ui-accent-500)

        muted:
          light:
            DEFAULT:   var(--color-ui-200)
            hover:     color-mix(in oklch, var(--color-ui-200), var(--color-ui-400) 20%)
            active:    color-mix(in oklch, var(--color-ui-200), var(--color-ui-400) 40%)
            select:    color-mix(in oklch, var(--color-ui-200), var(--color-ui-accent-600) 40%)
            highlight: var(--color-ui-accent-600)
          dark:
            DEFAULT:   var(--color-ui-800)
            hover:     color-mix(in oklch, var(--color-ui-800), var(--color-ui-600) 20%)
            active:    color-mix(in oklch, var(--color-ui-800), var(--color-ui-600) 40%)
            select:    color-mix(in oklch, var(--color-ui-800), var(--color-ui-accent-500) 40%)
            highlight: var(--color-ui-accent-500)

        subtle:
          light:
            DEFAULT:   var(--color-ui-300)
            hover:     color-mix(in oklch, var(--color-ui-300), var(--color-ui-500) 20%)
            active:    color-mix(in oklch, var(--color-ui-300), var(--color-ui-500) 40%)
            select:    color-mix(in oklch, var(--color-ui-300), var(--color-ui-accent-600) 40%)
            highlight: var(--color-ui-accent-600)
          dark:
            DEFAULT:   var(--color-ui-700)
            hover:     color-mix(in oklch, var(--color-ui-700), var(--color-ui-500) 20%)
            active:    color-mix(in oklch, var(--color-ui-700), var(--color-ui-500) 40%)
            select:    color-mix(in oklch, var(--color-ui-700), var(--color-ui-accent-500) 40%)
            highlight: var(--color-ui-accent-500)

        bold:
          light:
            DEFAULT:   var(--color-ui-400)
            hover:     color-mix(in oklch, var(--color-ui-400), var(--color-ui-600) 20%)
            active:    color-mix(in oklch, var(--color-ui-400), var(--color-ui-600) 40%)
            select:    color-mix(in oklch, var(--color-ui-400), var(--color-ui-accent-600) 40%)
            highlight: var(--color-ui-accent-600)
          dark:
            DEFAULT:   var(--color-ui-600)
            hover:     color-mix(in oklch, var(--color-ui-600), var(--color-ui-400) 20%)
            active:    color-mix(in oklch, var(--color-ui-600), var(--color-ui-400) 40%)
            select:    color-mix(in oklch, var(--color-ui-600), var(--color-ui-accent-500) 40%)
            highlight: var(--color-ui-accent-500)

        strong:
          light:
            DEFAULT:   var(--color-ui-500)
            hover:     color-mix(in oklch, var(--color-ui-500), var(--color-ui-700) 20%)
            active:    color-mix(in oklch, var(--color-ui-500), var(--color-ui-700) 40%)
            select:    color-mix(in oklch, var(--color-ui-500), var(--color-ui-accent-600) 40%)
            highlight: var(--color-ui-accent-600)
          dark:
            DEFAULT:   var(--color-ui-500)
            hover:     color-mix(in oklch, var(--color-ui-500), var(--color-ui-300) 20%)
            active:    color-mix(in oklch, var(--color-ui-500), var(--color-ui-300) 40%)
            select:    color-mix(in oklch, var(--color-ui-500), var(--color-ui-accent-500) 40%)
            highlight: var(--color-ui-accent-500)

      success:
        minimal:
          light:
            DEFAULT: --alpha(var(--color-success-200) / 20%)
            hover:   color-mix(in oklch, var(--color-success-50), var(--color-success-200) 20%)
            active:  color-mix(in oklch, var(--color-success-50), var(--color-success-200) 40%)
          dark:
            DEFAULT: --alpha(var(--color-success-800) / 20%)
            hover:   color-mix(in oklch, var(--color-success-950), var(--color-success-800) 20%)
            active:  color-mix(in oklch, var(--color-success-950), var(--color-success-800) 40%)

        subtle:
          light:
            DEFAULT: var(--color-success-200)
            hover:   color-mix(in oklch, var(--color-success-200), var(--color-success-400) 20%)
            active:  color-mix(in oklch, var(--color-success-200), var(--color-success-400) 40%)
          dark:
            DEFAULT: var(--color-success-800)
            hover:   color-mix(in oklch, var(--color-success-800), var(--color-success-600) 20%)
            active:  color-mix(in oklch, var(--color-success-800), var(--color-success-600) 40%)

        bold:
          light:
            DEFAULT: var(--color-success-600)
            hover:   color-mix(in oklch, var(--color-success-600), var(--color-success-800) 20%)
            active:  color-mix(in oklch, var(--color-success-600), var(--color-success-800) 40%)
          dark:
            DEFAULT: var(--color-success-500)
            hover:   color-mix(in oklch, var(--color-success-500), var(--color-success-300) 20%)
            active:  color-mix(in oklch, var(--color-success-500), var(--color-success-300) 40%)

      notice:
        minimal:
          light:
            DEFAULT: --alpha(var(--color-notice-200) / 20%)
            hover:   color-mix(in oklch, var(--color-notice-50), var(--color-notice-200) 20%)
            active:  color-mix(in oklch, var(--color-notice-50), var(--color-notice-200) 40%)
          dark:
            DEFAULT: --alpha(var(--color-notice-800) / 20%)
            hover:   color-mix(in oklch, var(--color-notice-950), var(--color-notice-800) 20%)
            active:  color-mix(in oklch, var(--color-notice-950), var(--color-notice-800) 40%)

        subtle:
          light:
            DEFAULT: var(--color-notice-200)
            hover:   color-mix(in oklch, var(--color-notice-200), var(--color-notice-400) 20%)
            active:  color-mix(in oklch, var(--color-notice-200), var(--color-notice-400) 40%)
          dark:
            DEFAULT: var(--color-notice-800)
            hover:   color-mix(in oklch, var(--color-notice-800), var(--color-notice-600) 20%)
            active:  color-mix(in oklch, var(--color-notice-800), var(--color-notice-600) 40%)

        bold:
          light:
            DEFAULT: var(--color-notice-600)
            hover:   color-mix(in oklch, var(--color-notice-600), var(--color-notice-800) 20%)
            active:  color-mix(in oklch, var(--color-notice-600), var(--color-notice-800) 40%)
          dark:
            DEFAULT: var(--color-notice-500)
            hover:   color-mix(in oklch, var(--color-notice-500), var(--color-notice-300) 20%)
            active:  color-mix(in oklch, var(--color-notice-500), var(--color-notice-300) 40%)

      warning:
        minimal:
          light:
            DEFAULT: --alpha(var(--color-warning-200) / 20%)
            hover:   color-mix(in oklch, var(--color-warning-50), var(--color-warning-200) 20%)
            active:  color-mix(in oklch, var(--color-warning-50), var(--color-warning-200) 40%)
          dark:
            DEFAULT: --alpha(var(--color-warning-800) / 20%)
            hover:   color-mix(in oklch, var(--color-warning-950), var(--color-warning-800) 20%)
            active:  color-mix(in oklch, var(--color-warning-950), var(--color-warning-800) 40%)

        subtle:
          light:
            DEFAULT: var(--color-warning-200)
            hover:   color-mix(in oklch, var(--color-warning-200), var(--color-warning-400) 20%)
            active:  color-mix(in oklch, var(--color-warning-200), var(--color-warning-400) 40%)
          dark:
            DEFAULT: var(--color-warning-800)
            hover:   color-mix(in oklch, var(--color-warning-800), var(--color-warning-600) 20%)
            active:  color-mix(in oklch, var(--color-warning-800), var(--color-warning-600) 40%)

        bold:
          light:
            DEFAULT: var(--color-warning-600)
            hover:   color-mix(in oklch, var(--color-warning-600), var(--color-warning-800) 20%)
            active:  color-mix(in oklch, var(--color-warning-600), var(--color-warning-800) 40%)
          dark:
            DEFAULT: var(--color-warning-500)
            hover:   color-mix(in oklch, var(--color-warning-500), var(--color-warning-300) 20%)
            active:  color-mix(in oklch, var(--color-warning-500), var(--color-warning-300) 40%)

      danger:
        minimal:
          light:
            DEFAULT: --alpha(var(--color-danger-200) / 20%)
            hover:   color-mix(in oklch, var(--color-danger-50), var(--color-danger-200) 20%)
            active:  color-mix(in oklch, var(--color-danger-50), var(--color-danger-200) 40%)
          dark:
            DEFAULT: --alpha(var(--color-danger-800) / 20%)
            hover:   color-mix(in oklch, var(--color-danger-950), var(--color-danger-800) 20%)
            active:  color-mix(in oklch, var(--color-danger-950), var(--color-danger-800) 40%)

        subtle:
          light:
            DEFAULT: var(--color-danger-200)
            hover:   color-mix(in oklch, var(--color-danger-200), var(--color-danger-400) 20%)
            active:  color-mix(in oklch, var(--color-danger-200), var(--color-danger-400) 40%)
          dark:
            DEFAULT: var(--color-danger-800)
            hover:   color-mix(in oklch, var(--color-danger-800), var(--color-danger-600) 20%)
            active:  color-mix(in oklch, var(--color-danger-800), var(--color-danger-600) 40%)

        bold:
          light:
            DEFAULT: var(--color-danger-600)
            hover:   color-mix(in oklch, var(--color-danger-600), var(--color-danger-800) 20%)
            active:  color-mix(in oklch, var(--color-danger-600), var(--color-danger-800) 40%)
          dark:
            DEFAULT: var(--color-danger-500)
            hover:   color-mix(in oklch, var(--color-danger-500), var(--color-danger-300) 20%)
            active:  color-mix(in oklch, var(--color-danger-500), var(--color-danger-300) 40%)

    border: &semantic-color-border
      ui:
        minimal:
          light:
            DEFAULT:   var(--color-ui-100)
            hover:     var(--color-ui-200)
            focus:     var(--color-ui-accent-600)
            select:    var(--color-ui-accent-400)
            highlight: var(--color-ui-accent-600)
          dark:
            DEFAULT:   var(--color-ui-900)
            hover:     var(--color-ui-800)
            focus:     var(--color-ui-accent-500)
            select:    var(--color-ui-accent-700)
            highlight: var(--color-ui-accent-500)

        muted:
          light:
            DEFAULT:   var(--color-ui-200)
            hover:     var(--color-ui-300)
            focus:     var(--color-ui-accent-600)
            select:    var(--color-ui-accent-400)
            highlight: var(--color-ui-accent-600)
          dark:
            DEFAULT:   var(--color-ui-800)
            hover:     var(--color-ui-700)
            focus:     var(--color-ui-accent-500)
            select:    var(--color-ui-accent-700)
            highlight: var(--color-ui-accent-500)

        subtle:
          light:
            DEFAULT:   var(--color-ui-300)
            hover:     var(--color-ui-400)
            focus:     var(--color-ui-accent-600)
            select:    var(--color-ui-accent-400)
            highlight: var(--color-ui-accent-600)
          dark:
            DEFAULT:   var(--color-ui-700)
            hover:     var(--color-ui-600)
            focus:     var(--color-ui-accent-500)
            select:    var(--color-ui-accent-700)
            highlight: var(--color-ui-accent-500)

        bold:
          light:
            DEFAULT:   var(--color-ui-400)
            hover:     var(--color-ui-500)
            focus:     var(--color-ui-accent-600)
            select:    var(--color-ui-accent-400)
            highlight: var(--color-ui-accent-600)
          dark:
            DEFAULT:   var(--color-ui-600)
            hover:     var(--color-ui-500)
            focus:     var(--color-ui-accent-500)
            select:    var(--color-ui-accent-700)
            highlight: var(--color-ui-accent-500)

        strong:
          light:
            DEFAULT:   var(--color-ui-500)
            hover:     var(--color-ui-600)
            focus:     var(--color-ui-accent-600)
            select:    var(--color-ui-accent-400)
            highlight: var(--color-ui-accent-600)
          dark:
            DEFAULT:   var(--color-ui-500)
            hover:     var(--color-ui-400)
            focus:     var(--color-ui-accent-500)
            select:    var(--color-ui-accent-700)
            highlight: var(--color-ui-accent-500)

      success:
        light:
          DEFAULT:   var(--color-success-600)
          focus:     var(--color-success-600)
          select:    var(--color-success-400)
          highlight: var(--color-success-600)
        dark:
          DEFAULT:   var(--color-success-500)
          focus:     var(--color-success-500)
          select:    var(--color-success-700)
          highlight: var(--color-success-500)

      notice:
        light:
          DEFAULT:   var(--color-notice-600)
          focus:     var(--color-notice-600)
          select:    var(--color-notice-400)
          highlight: var(--color-notice-600)
        dark:
          DEFAULT:   var(--color-notice-500)
          focus:     var(--color-notice-500)
          select:    var(--color-notice-700)
          highlight: var(--color-notice-500)

      warning:
        light:
          DEFAULT:   var(--color-warning-600)
          focus:     var(--color-warning-600)
          select:    var(--color-warning-400)
          highlight: var(--color-warning-600)
        dark:
          DEFAULT:   var(--color-warning-500)
          focus:     var(--color-warning-500)
          select:    var(--color-warning-700)
          highlight: var(--color-warning-500)

      danger:
        light:
          DEFAULT:   var(--color-danger-600)
          focus:     var(--color-danger-600)
          select:    var(--color-danger-400)
          highlight: var(--color-danger-600)
        dark:
          DEFAULT:   var(--color-danger-500)
          focus:     var(--color-danger-500)
          select:    var(--color-danger-700)
          highlight: var(--color-danger-500)

    ring:
      *semantic-color-border

    text:
      primary:
        light: var(--color-ui-950)
        dark:  var(--color-ui-100)

      secondary:
        light: var(--color-ui-600)
        dark:  var(--color-ui-400)

      tertiary:
        light: var(--color-ui-300)
        dark:  var(--color-ui-500)

      link:
        light: var(--color-ui-accent-600)
        dark:  var(--color-ui-accent-500)

      success:
        light: var(--color-success-600)
        dark:  var(--color-success-500)

      notice:
        light: var(--color-notice-600)
        dark:  var(--color-notice-500)

      warning:
        light: var(--color-warning-600)
        dark:  var(--color-warning-500)

      danger:
        light: var(--color-danger-600)
        dark:  var(--color-danger-500)

---

# Levels:
#   system.group.namespace.component.category.property.role.variant.emphasis.scale.state.mode

schema:
  system: kds

  modes:
    - light
    - dark


primitive:
  schema:
    default:
      mapping: category.role.scale
      # token:        category.role.scale
      # css_class:    category.role.scale
      # css_variable: category.role.scale

    spacing:
      mapping: category.scale

  color:
    space: srgb

    ui:
      0:   var(--color-white)
      50:  var(--color-gray-50)
      100: var(--color-gray-100)
      200: var(--color-gray-200)
      300: var(--color-gray-300)
      400: var(--color-gray-400)
      500: var(--color-gray-500)
      600: var(--color-gray-600)
      700: var(--color-gray-700)
      800: var(--color-gray-800)
      900: var(--color-gray-900)
      950: var(--color-gray-950)

    accent:
      50:  var(--color-violet-50)
      100: var(--color-violet-100)
      200: var(--color-violet-200)
      300: var(--color-violet-300)
      400: var(--color-violet-400)
      500: var(--color-violet-500)
      600: var(--color-violet-600)
      700: var(--color-violet-700)
      800: var(--color-violet-800)
      900: var(--color-violet-900)
      950: var(--color-violet-950)

    ui-accent:
      50:  var(--color-accent-50)
      100: var(--color-accent-100)
      200: var(--color-accent-200)
      300: var(--color-accent-300)
      400: var(--color-accent-400)
      500: var(--color-accent-500)
      600: var(--color-accent-600)
      700: var(--color-accent-700)
      800: var(--color-accent-800)
      900: var(--color-accent-900)
      950: var(--color-accent-950)

    information:
      50:  var(--color-blue-50)
      100: var(--color-blue-100)
      200: var(--color-blue-200)
      300: var(--color-blue-300)
      400: var(--color-blue-400)
      500: var(--color-blue-500)
      600: var(--color-blue-600)
      700: var(--color-blue-700)
      800: var(--color-blue-800)
      900: var(--color-blue-900)
      950: var(--color-blue-950)

    success:
      50:  var(--color-green-50)
      100: var(--color-green-100)
      200: var(--color-green-200)
      300: var(--color-green-300)
      400: var(--color-green-400)
      500: var(--color-green-500)
      600: var(--color-green-600)
      700: var(--color-green-700)
      800: var(--color-green-800)
      900: var(--color-green-900)
      950: var(--color-green-950)

    warning:
      50:  var(--color-orange-50)
      100: var(--color-orange-100)
      200: var(--color-orange-200)
      300: var(--color-orange-300)
