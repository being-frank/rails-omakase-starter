  spacing:
    '*': initial
    2:   0.125rem
    4:   0.25rem
    8:   0.5rem
    12:  0.75rem
    16:  1rem
    24:  1.5rem
    32:  2rem
    40:  2.5rem
    48:  3rem
    64:  4rem
    80:  5rem
    96:  6rem
    112: 7rem
    128: 8rem


semantic:
  color:
    bg:
      ui:
        primary:
          $base:
            light: var(--color-ui-0)
            dark:  var(--color-ui-950)
          hovered:
            light: color-mix(in display-p3, var(--color-ui-0),   var(--color-ui-200) 20%)
            dark:  color-mix(in display-p3, var(--color-ui-950), var(--color-ui-800) 20%)
          pressed:
            light: color-mix(in display-p3, var(--color-ui-0),   var(--color-ui-200) 40%)
            dark:  color-mix(in display-p3, var(--color-ui-950), var(--color-ui-800) 40%)
          selected:
            light: color-mix(in display-p3, var(--color-ui-0),   var(--color-ui-accent-600) 40%)
            dark:  color-mix(in display-p3, var(--color-ui-950), var(--color-ui-accent-500) 40%)
          selected-bold:
            light: var(--color-ui-accent-600)
            dark:  var(--color-ui-accent-500)

        minimal:
          $base:
            light: var(--color-ui-100)
            dark:  var(--color-ui-900)
          hovered:
            light: color-mix(in display-p3, var(--color-ui-100), var(--color-ui-300) 20%)
            dark:  color-mix(in display-p3, var(--color-ui-900), var(--color-ui-700) 20%)
