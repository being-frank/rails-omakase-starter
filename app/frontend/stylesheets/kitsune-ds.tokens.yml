schema:
  system: kds

  themes:
    - light
    - dark

  parse:
    primitive:
      BASE: category.role.scale
      spacing: scale

    semantic:
      BASE: category.property.role.emphasis.state.theme
      color:
        text: category.property.role.emphasis.theme

  output:
    token:
      BASE: system.set.component.category.property.role.variant.emphasis.scale.state.theme

      primitive:
        BASE: category.role.scale
        spacing: category.scale

      semantic:
        BASE: system.category.property.role.variant.emphasis.scale.state.theme

    css_variable:
      primitive:
        BASE: category.role.scale

      semantic:
        BASE: property.role.variant.emphasis.scale.state

    css_class:
      BASE: property.role.variant.emphasis.scale.state

# ----

primitive:
  color:
    neutral:
      0:   var(--color-white)
      50:  var(--color-gray-50)
      100: var(--color-gray-100)
      200: var(--color-gray-200)
      300: var(--color-gray-300)
      400: var(--color-gray-400)
      500: var(--color-gray-500)
      600: var(--color-gray-600)
      700: var(--color-gray-700)
      800: var(--color-gray-800)
      900: var(--color-gray-900)
      950: var(--color-gray-950)

    success:
      50:  var(--color-emerald-50)
      100: var(--color-emerald-100)
      200: var(--color-emerald-200)
      300: var(--color-emerald-300)
      400: var(--color-emerald-400)
      500: var(--color-emerald-500)
      600: var(--color-emerald-600)
      700: var(--color-emerald-700)
      800: var(--color-emerald-800)
      900: var(--color-emerald-900)
      950: var(--color-emerald-950)

    information:
      50:  var(--color-sky-50)
      100: var(--color-sky-100)
      200: var(--color-sky-200)
      300: var(--color-sky-300)
      400: var(--color-sky-400)
      500: var(--color-sky-500)
      600: var(--color-sky-600)
      700: var(--color-sky-700)
      800: var(--color-sky-800)
      900: var(--color-sky-900)
      950: var(--color-sky-950)

    warning:
      50:  var(--color-amber-50)
      100: var(--color-amber-100)
      200: var(--color-amber-200)
      300: var(--color-amber-300)
      400: var(--color-amber-400)
      500: var(--color-amber-500)
      600: var(--color-amber-600)
      700: var(--color-amber-700)
      800: var(--color-amber-800)
      900: var(--color-amber-900)
      950: var(--color-amber-950)

    alert:
      50:  var(--color-rose-50)
      100: var(--color-rose-100)
      200: var(--color-rose-200)
      300: var(--color-rose-300)
      400: var(--color-rose-400)
      500: var(--color-rose-500)
      600: var(--color-rose-600)
      700: var(--color-rose-700)
      800: var(--color-rose-800)
      900: var(--color-rose-900)
      950: var(--color-rose-950)

    discovery:
      50:  var(--color-fuchsia-50)
      100: var(--color-fuchsia-100)
      200: var(--color-fuchsia-200)
      300: var(--color-fuchsia-300)
      400: var(--color-fuchsia-400)
      500: var(--color-fuchsia-500)
      600: var(--color-fuchsia-600)
      700: var(--color-fuchsia-700)
      800: var(--color-fuchsia-800)
      900: var(--color-fuchsia-900)
      950: var(--color-fuchsia-950)

    accent:
      50:  var(--color-violet-50)
      100: var(--color-violet-100)
      200: var(--color-violet-200)
      300: var(--color-violet-300)
      400: var(--color-violet-400)
      500: var(--color-violet-500)
      600: var(--color-violet-600)
      700: var(--color-violet-700)
      800: var(--color-violet-800)
      900: var(--color-violet-900)
      950: var(--color-violet-950)

  spacing:
    '*': initial
    2:   0.125rem
    4:   0.25rem
    8:   0.5rem
    12:  0.75rem
    16:  1rem
    24:  1.5rem
    32:  2rem
    40:  2.5rem
    48:  3rem
    64:  4rem
    80:  5rem
    96:  6rem
    112: 7rem
    128: 8rem

# ----

semantic:
  color:
    bg:
      surface:
        primary:
          BASE:
            light: var(--color-neutral-0)
            dark:  var(--color-neutral-950)
          hovered:
            light: color-mix(in oklch, var(--color-neutral-0),   var(--color-neutral-200) 20%)
            dark:  color-mix(in oklch, var(--color-neutral-950), var(--color-neutral-800) 20%)
          pressed:
            light: color-mix(in oklch, var(--color-neutral-0),   var(--color-neutral-200) 40%)
            dark:  color-mix(in oklch, var(--color-neutral-950), var(--color-neutral-800) 40%)
          selected:
            light: color-mix(in oklch, var(--color-neutral-0),   var(--color-accent-600) 40%)
            dark:  color-mix(in oklch, var(--color-neutral-950), var(--color-accent-500) 40%)
          highlighted:
            light: var(--color-accent-600)
            dark:  var(--color-accent-500)

      success:
        subtlest:
          BASE:
            light: var(--color-success-50)
            dark:  var(--color-success-950)
          hovered:
            light: color-mix(in oklch, var(--color-success-50),  var(--color-success-200) 20%)
            dark:  color-mix(in oklch, var(--color-success-950), var(--color-success-800) 20%)
          pressed:
            light: color-mix(in oklch, var(--color-success-50),  var(--color-success-200) 40%)
            dark:  color-mix(in oklch, var(--color-success-950), var(--color-success-800) 40%)
        subtler:
          BASE:
            light: var(--color-success-200)
            dark:  var(--color-success-800)
          hovered:
            light: color-mix(in oklch, var(--color-success-200), var(--color-success-400) 20%)
            dark:  color-mix(in oklch, var(--color-success-800), var(--color-success-600) 20%)
          pressed:
            light: color-mix(in oklch, var(--color-success-200), var(--color-success-400) 40%)
            dark:  color-mix(in oklch, var(--color-success-800), var(--color-success-600) 40%)
        bold:
          BASE:
            light: var(--color-success-600)
            dark:  var(--color-success-500)
          hovered:
            light: color-mix(in oklch, var(--color-success-600), var(--color-success-800) 20%)
            dark:  color-mix(in oklch, var(--color-success-500), var(--color-success-300) 20%)
          pressed:
            light: color-mix(in oklch, var(--color-success-600), var(--color-success-800) 40%)
            dark:  color-mix(in oklch, var(--color-success-500), var(--color-success-300) 40%)

    text:
      default:
        BASE:
          light: var(--color-neutral-900)
          dark:  var(--color-neutral-100)

      subtle:
        BASE:
          light: var(--color-neutral-600)
          dark:  var(--color-neutral-400)

      subtler:
        BASE:
          light: var(--color-neutral-400)
          dark:  var(--color-neutral-600)

      subtlest:
        BASE:
          light: var(--color-neutral-300)
          dark:  var(--color-neutral-700)

      disabled:
        BASE:
          light: --alpha(var(--color-neutral-400) / 40%)
          dark:  --alpha(var(--color-neutral-600) / 40%)

      selected:
        BASE:
          light: var(--color-accent-600)
          dark:  var(--color-accent-500)

      success:
        BASE:
          light: var(--color-success-600)
          dark:  var(--color-success-500)

        bold:
          light: var(--color-success-700)
          dark:  var(--color-success-400)

      information:
        BASE:
          light: var(--color-information-600)
          dark:  var(--color-information-500)

        bold:
          light: var(--color-information-700)
          dark:  var(--color-information-400)

      warning:
        BASE:
          light: var(--color-warning-600)
          dark:  var(--color-warning-500)

        bold:
          light: var(--color-warning-700)
          dark:  var(--color-warning-400)

      alert:
        BASE:
          light: var(--color-alert-600)
          dark:  var(--color-alert-500)

        bold:
          light: var(--color-alert-700)
          dark:  var(--color-alert-400)

      discovery:
        BASE:
          light: var(--color-discovery-600)
          dark:  var(--color-discovery-500)

        bold:
          light: var(--color-discovery-700)
          dark:  var(--color-discovery-400)

      inverse:
        BASE:
          light: var(--color-neutral-100)
          dark:  var(--color-neutral-900)
