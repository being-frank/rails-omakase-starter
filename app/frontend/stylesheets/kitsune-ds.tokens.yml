schema:
  system: kds

  themes:
    - default

  modes:
    - light
    - dark

  taxonomy: system.set.component.category.property.role.variant.emphasis.scale.state.mode

  definitions:
    primitive:
      $default: category.role.scale
      spacing: scale

    semantic:
      $default: category.property.role.emphasis.state.mode
      color:
        border: category.property.role.emphasis.state.mode
        text: category.property.role.emphasis.mode

  formats:
    token:
      $default: system.set.component.category.property.role.variant.emphasis.scale.state.mode

      primitive:
        $default: category.role.scale
        spacing: category.scale

      semantic:
        $default: system.category.property.role.variant.emphasis.scale.state.mode

    css_variable:
      primitive:
        $default: category.role.scale

      semantic:
        $default: property.role.variant.emphasis.scale.state

    css_class:
      $default: property.role.variant.emphasis.scale.state


primitive:
