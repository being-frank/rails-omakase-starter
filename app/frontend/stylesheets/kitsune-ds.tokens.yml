formats:
  token:
    DEFAULT: prefix.set.component.category.property.role.emphasis.state.mode

    primitive:
      DEFAULT: category.role.emphasis
      spacing: category.emphasis

    semantic:
      DEFAULT: prefix.category.property.role.emphasis.state.mode

  css_variable:
    primitive:
      DEFAULT: category.role.emphasis

    semantic:
      DEFAULT: prefix.category.property.role.emphasis.state

  css_class:
    DEFAULT: property.role.emphasis.state


definitions:
  prefix: kds

  modes:
    - light
    - dark

  emphasis:
    - subtlest
    - subtler
    - subtle
    - bold
    - bolder
    - boldest

  roles:
    - neutral
    - brand
    - success
    - information
    - warning
    - alert
    - discovery
    - accent
    - inverse
    - input

  states:
    - default
    - hovered
    - pressed
    - selected
    - focused
    - disabled


primitive:
  color:
    ui:
      0:   var(--color-white)
      50:  var(--color-gray-50)
      100: var(--color-gray-100)
      200: var(--color-gray-200)
      300: var(--color-gray-300)
      400: var(--color-gray-400)
      500: var(--color-gray-500)
      600: var(--color-gray-600)
      700: var(--color-gray-700)
      800: var(--color-gray-800)
      900: var(--color-gray-900)
      950: var(--color-gray-950)

    ui-accent:
      50:  var(--color-blue-50)
      100: var(--color-blue-100)
      200: var(--color-blue-200)
      300: var(--color-blue-300)
      400: var(--color-blue-400)
      500: var(--color-blue-500)
      600: var(--color-blue-600)
      700: var(--color-blue-700)
      800: var(--color-blue-800)
      900: var(--color-blue-900)
      950: var(--color-blue-950)

    success:
      50:  var(--color-emerald-50)
      100: var(--color-emerald-100)
      200: var(--color-emerald-200)
      300: var(--color-emerald-300)
      400: var(--color-emerald-400)
      500: var(--color-emerald-500)
      600: var(--color-emerald-600)
      700: var(--color-emerald-700)
      800: var(--color-emerald-800)
      900: var(--color-emerald-900)
      950: var(--color-emerald-950)

    information:
      50:  var(--color-sky-50)
      100: var(--color-sky-100)
      200: var(--color-sky-200)
      300: var(--color-sky-300)
      400: var(--color-sky-400)
      500: var(--color-sky-500)
      600: var(--color-sky-600)
      700: var(--color-sky-700)
      800: var(--color-sky-800)
      900: var(--color-sky-900)
      950: var(--color-sky-950)

    warning:
      50:  var(--color-amber-50)
      100: var(--color-amber-100)
      200: var(--color-amber-200)
      300: var(--color-amber-300)
      400: var(--color-amber-400)
      500: var(--color-amber-500)
      600: var(--color-amber-600)
      700: var(--color-amber-700)
      800: var(--color-amber-800)
      900: var(--color-amber-900)
      950: var(--color-amber-950)

    alert:
      50:  var(--color-rose-50)
      100: var(--color-rose-100)
      200: var(--color-rose-200)
      300: var(--color-rose-300)
      400: var(--color-rose-400)
      500: var(--color-rose-500)
      600: var(--color-rose-600)
      700: var(--color-rose-700)
      800: var(--color-rose-800)
      900: var(--color-rose-900)
      950: var(--color-rose-950)

    discovery:
      50:  var(--color-fuchsia-50)
      100: var(--color-fuchsia-100)
      200: var(--color-fuchsia-200)
      300: var(--color-fuchsia-300)
      400: var(--color-fuchsia-400)
      500: var(--color-fuchsia-500)
      600: var(--color-fuchsia-600)
      700: var(--color-fuchsia-700)
      800: var(--color-fuchsia-800)
      900: var(--color-fuchsia-900)
      950: var(--color-fuchsia-950)

    accent:
      50:  var(--color-violet-50)
      100: var(--color-violet-100)
      200: var(--color-violet-200)
      300: var(--color-violet-300)
      400: var(--color-violet-400)
      500: var(--color-violet-500)
      600: var(--color-violet-600)
      700: var(--color-violet-700)
      800: var(--color-violet-800)
      900: var(--color-violet-900)
      950: var(--color-violet-950)

  spacing:
    '*': initial
    2:   0.125rem
    4:   0.25rem
    8:   0.5rem
    12:  0.75rem
    16:  1rem
    24:  1.5rem
    32:  2rem
    40:  2.5rem
    48:  3rem
    64:  4rem
    80:  5rem
    96:  6rem
    112: 7rem
    128: 8rem


semantic:
  color:
    text:
      default:
        light: var(--color-ui-900)
        dark:  var(--color-ui-100)

      subtle:
        light: var(--color-ui-600)
        dark:  var(--color-ui-400)

      subtler:
        light: var(--color-ui-400)
        dark:  var(--color-ui-600)

      subtlest:
        light: var(--color-ui-300)
        dark:  var(--color-ui-700)

      disabled:
        light: --alpha(var(--color-ui-400) / 40%)
        dark:  --alpha(var(--color-ui-600) / 40%)

      selected:
        light: var(--color-accent-600)
        dark:  var(--color-accent-500)

      success:
        DEFAULT:
          light: var(--color-success-600)
          dark:  var(--color-success-500)

        bold:
          light: var(--color-success-700)
          dark:  var(--color-success-400)

      information:
        DEFAULT:
          light: var(--color-information-600)
          dark:  var(--color-information-500)

        bold:
          light: var(--color-information-700)
          dark:  var(--color-information-400)

      warning:
        DEFAULT:
          light: var(--color-warning-600)
          dark:  var(--color-warning-500)

        bold:
          light: var(--color-warning-700)
          dark:  var(--color-warning-400)

      alert:
        DEFAULT:
          light: var(--color-alert-600)
          dark:  var(--color-alert-500)

        bold:
          light: var(--color-alert-700)
          dark:  var(--color-alert-400)

      discovery:
        DEFAULT:
          light: var(--color-discovery-600)
          dark:  var(--color-discovery-500)

        bold:
          light: var(--color-discovery-700)
          dark:  var(--color-discovery-400)

      inverse:
        light: var(--color-ui-100)
        dark:  var(--color-ui-900)
