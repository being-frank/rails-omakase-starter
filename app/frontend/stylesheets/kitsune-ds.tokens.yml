schema:
  system: kds

  themes:
    - default

  modes:
    - light
    - dark

  taxonomy: system.set.component.category.property.role.variant.emphasis.scale.state.mode

  definitions:
    primitive:
      $default: category.role.scale
      spacing:  scale

    semantic:
      $default: category.property.role.emphasis.state.mode
      color:
        bg:     category.property.role.variant.emphasis.state.mode
        border: category.property.role.variant.emphasis.state.mode
        text:   category.property.role.variant.emphasis.mode

  formats:
    token:
      $default: system.set.component.category.property.role.variant.emphasis.scale.state.mode

      primitive:
        $default: category.role.scale
        spacing:  category.scale

      semantic:
        $default: system.category.property.role.variant.emphasis.scale.state.mode

    css_variable:
      primitive:
        $default: category.role.scale

      semantic:
        $default: property.role.variant.emphasis.scale.state

    css_class:
      $default: property.role.variant.emphasis.scale.state


primitive:
  color:
    space: srgb

    ui:
      0:   var(--color-white)
      50:  var(--color-gray-50)
      100: var(--color-gray-100)
      200: var(--color-gray-200)
      300: var(--color-gray-300)
      400: var(--color-gray-400)
      500: var(--color-gray-500)
      600: var(--color-gray-600)
      700: var(--color-gray-700)
      800: var(--color-gray-800)
      900: var(--color-gray-900)
      950: var(--color-gray-950)

    accent:
      50:  var(--color-violet-50)
      100: var(--color-violet-100)
      200: var(--color-violet-200)
      300: var(--color-violet-300)
      400: var(--color-violet-400)
      500: var(--color-violet-500)
      600: var(--color-violet-600)
      700: var(--color-violet-700)
      800: var(--color-violet-800)
      900: var(--color-violet-900)
      950: var(--color-violet-950)

    ui-accent:
      50:  var(--color-accent-50)
      100: var(--color-accent-100)
      200: var(--color-accent-200)
      300: var(--color-accent-300)
      400: var(--color-accent-400)
      500: var(--color-accent-500)
      600: var(--color-accent-600)
      700: var(--color-accent-700)
      800: var(--color-accent-800)
      900: var(--color-accent-900)
      950: var(--color-accent-950)

    success:
      50:  var(--color-green-50)
      100: var(--color-green-100)
      200: var(--color-green-200)
      300: var(--color-green-300)
      400: var(--color-green-400)
      500: var(--color-green-500)
      600: var(--color-green-600)
      700: var(--color-green-700)
      800: var(--color-green-800)
      900: var(--color-green-900)
      950: var(--color-green-950)

    notice:
      50:  var(--color-blue-50)
      100: var(--color-blue-100)
      200: var(--color-blue-200)
      300: var(--color-blue-300)
      400: var(--color-blue-400)
      500: var(--color-blue-500)
      600: var(--color-blue-600)
      700: var(--color-blue-700)
      800: var(--color-blue-800)
      900: var(--color-blue-900)
      950: var(--color-blue-950)

    warning:
      50:  var(--color-amber-50)
      100: var(--color-amber-100)
      200: var(--color-amber-200)
      300: var(--color-amber-300)
      400: var(--color-amber-400)
      500: var(--color-amber-500)
      600: var(--color-amber-600)
      700: var(--color-amber-700)
      800: var(--color-amber-800)
      900: var(--color-amber-900)
      950: var(--color-amber-950)

    alert:
      50:  var(--color-red-50)
      100: var(--color-red-100)
      200: var(--color-red-200)
      300: var(--color-red-300)
      400: var(--color-red-400)
      500: var(--color-red-500)
      600: var(--color-red-600)
      700: var(--color-red-700)
      800: var(--color-red-800)
      900: var(--color-red-900)
      950: var(--color-red-950)

    discovery:
      50:  var(--color-purple-50)
      100: var(--color-purple-100)
      200: var(--color-purple-200)
      300: var(--color-purple-300)
      400: var(--color-purple-400)
      500: var(--color-purple-500)
      600: var(--color-purple-600)
      700: var(--color-purple-700)
      800: var(--color-purple-800)
      900: var(--color-purple-900)
      950: var(--color-purple-950)

  spacing:
    '*': initial
    2:   0.125rem
    4:   0.25rem
    8:   0.5rem
    12:  0.75rem
    16:  1rem
    24:  1.5rem
    32:  2rem
    40:  2.5rem
    48:  3rem
    64:  4rem
    80:  5rem
    96:  6rem
    112: 7rem
    128: 8rem


semantic:
  color:
    bg:
      ui:
        $base: # no variant
          primary:
            $base:
              light: var(--color-ui-0)
              dark:  var(--color-ui-950)
            hovered:
              light: color-mix(in var(--color-space), var(--color-ui-0),   var(--color-ui-200) 20%)
              dark:  color-mix(in var(--color-space), var(--color-ui-950), var(--color-ui-800) 20%)
            pressed:
              light: color-mix(in var(--color-space), var(--color-ui-0),   var(--color-ui-200) 40%)
              dark:  color-mix(in var(--color-space), var(--color-ui-950), var(--color-ui-800) 40%)
            selected:
              light: color-mix(in var(--color-space), var(--color-ui-0),   var(--color-ui-accent-600) 40%)
              dark:  color-mix(in var(--color-space), var(--color-ui-950), var(--color-ui-accent-500) 40%)
            selected-bold:
              light: var(--color-ui-accent-600)
              dark:  var(--color-ui-accent-500)

          muted:
            $base:
              light: var(--color-ui-100)
              dark:  var(--color-ui-900)
            hovered:
              light: color-mix(in var(--color-space), var(--color-ui-100), var(--color-ui-300) 20%)
              dark:  color-mix(in var(--color-space), var(--color-ui-900), var(--color-ui-700) 20%)
            pressed:
              light: color-mix(in var(--color-space), var(--color-ui-100), var(--color-ui-300) 40%)
              dark:  color-mix(in var(--color-space), var(--color-ui-900), var(--color-ui-700) 40%)
            selected:
              light: color-mix(in var(--color-space), var(--color-ui-100), var(--color-ui-accent-600) 40%)
              dark:  color-mix(in var(--color-space), var(--color-ui-900), var(--color-ui-accent-500) 40%)
            selected-bold:
              light: var(--color-ui-accent-600)
              dark:  var(--color-ui-accent-500)

          minimal:
            $base:
              light: var(--color-ui-200)
              dark:  var(--color-ui-800)
            hovered:
              light: color-mix(in var(--color-space), var(--color-ui-200), var(--color-ui-400) 20%)
              dark:  color-mix(in var(--color-space), var(--color-ui-800), var(--color-ui-600) 20%)
            pressed:
              light: color-mix(in var(--color-space), var(--color-ui-200), var(--color-ui-400) 40%)
              dark:  color-mix(in var(--color-space), var(--color-ui-800), var(--color-ui-600) 40%)
            selected:
              light: color-mix(in var(--color-space), var(--color-ui-200), var(--color-ui-accent-600) 40%)
              dark:  color-mix(in var(--color-space), var(--color-ui-800), var(--color-ui-accent-500) 40%)
            selected-bold:
              light: var(--color-ui-accent-600)
              dark:  var(--color-ui-accent-500)

          subtle:
            $base:
              light: var(--color-ui-300)
              dark:  var(--color-ui-700)
            hovered:
              light: color-mix(in var(--color-space), var(--color-ui-300), var(--color-ui-500) 20%)
              dark:  color-mix(in var(--color-space), var(--color-ui-700), var(--color-ui-500) 20%)
            pressed:
              light: color-mix(in var(--color-space), var(--color-ui-300), var(--color-ui-500) 40%)
              dark:  color-mix(in var(--color-space), var(--color-ui-700), var(--color-ui-500) 40%)
            selected:
              light: color-mix(in var(--color-space), var(--color-ui-300), var(--color-ui-accent-600) 40%)
              dark:  color-mix(in var(--color-space), var(--color-ui-700), var(--color-ui-accent-500) 40%)
            selected-bold:
              light: var(--color-ui-accent-600)
              dark:  var(--color-ui-accent-500)

          bold:
            $base:
              light: var(--color-ui-400)
              dark:  var(--color-ui-600)
            hovered:
              light: color-mix(in var(--color-space), var(--color-ui-400), var(--color-ui-600) 20%)
              dark:  color-mix(in var(--color-space), var(--color-ui-600), var(--color-ui-400) 20%)
            pressed:
              light: color-mix(in var(--color-space), var(--color-ui-400), var(--color-ui-600) 40%)
              dark:  color-mix(in var(--color-space), var(--color-ui-600), var(--color-ui-400) 40%)
            selected:
              light: color-mix(in var(--color-space), var(--color-ui-400), var(--color-ui-accent-600) 40%)
              dark:  color-mix(in var(--color-space), var(--color-ui-600), var(--color-ui-accent-500) 40%)
            selected-bold:
              light: var(--color-ui-accent-600)
              dark:  var(--color-ui-accent-500)

          strong:
            $base:
              light: var(--color-ui-500)
              dark:  var(--color-ui-500)
            hovered:
              light: color-mix(in var(--color-space), var(--color-ui-500), var(--color-ui-700) 20%)
              dark:  color-mix(in var(--color-space), var(--color-ui-500), var(--color-ui-300) 20%)
            pressed:
              light: color-mix(in var(--color-space), var(--color-ui-500), var(--color-ui-700) 40%)
              dark:  color-mix(in var(--color-space), var(--color-ui-500), var(--color-ui-300) 40%)
            selected:
              light: color-mix(in var(--color-space), var(--color-ui-500), var(--color-ui-accent-600) 40%)
              dark:  color-mix(in var(--color-space), var(--color-ui-500), var(--color-ui-accent-500) 40%)
            selected-bold:
              light: var(--color-ui-accent-600)
              dark:  var(--color-ui-accent-500)

      status:
        success:
          minimal:
            $base:
              light: color-mix(in var(--color-space), var(--color-success-200) 20%, transparent)
              dark:  color-mix(in var(--color-space), var(--color-success-800) 20%, transparent)
            hovered:
              light: color-mix(in var(--color-space), var(--color-success-400) 20%, transparent)
              dark:  color-mix(in var(--color-space), var(--color-success-600) 20%, transparent)
            pressed:
              light: color-mix(in var(--color-space), var(--color-success-400) 40%, transparent)
              dark:  color-mix(in var(--color-space), var(--color-success-600) 40%, transparent)

          subtle:
            $base:
              light: var(--color-success-200)
              dark:  var(--color-success-800)
            hovered:
              light: color-mix(in var(--color-space), var(--color-success-200), var(--color-success-400) 20%)
              dark:  color-mix(in var(--color-space), var(--color-success-800), var(--color-success-600) 20%)
            pressed:
              light: color-mix(in var(--color-space), var(--color-success-200), var(--color-success-400) 40%)
              dark:  color-mix(in var(--color-space), var(--color-success-800), var(--color-success-600) 40%)

          bold:
            $base:
              light: var(--color-success-600)
              dark:  var(--color-success-500)
            hovered:
              light: color-mix(in var(--color-space), var(--color-success-600), var(--color-success-800) 20%)
              dark:  color-mix(in var(--color-space), var(--color-success-500), var(--color-success-300) 20%)
            pressed:
              light: color-mix(in var(--color-space), var(--color-success-600), var(--color-success-800) 40%)
              dark:  color-mix(in var(--color-space), var(--color-success-500), var(--color-success-300) 40%)

        notice:
          minimal:
            $base:
              light: color-mix(in var(--color-space), var(--color-notice-200) 20%, transparent)
              dark:  color-mix(in var(--color-space), var(--color-notice-800) 20%, transparent)
            hovered:
              light: color-mix(in var(--color-space), var(--color-notice-400) 20%, transparent)
              dark:  color-mix(in var(--color-space), var(--color-notice-600) 20%, transparent)
            pressed:
              light: color-mix(in var(--color-space), var(--color-notice-400) 40%, transparent)
              dark:  color-mix(in var(--color-space), var(--color-notice-600) 40%, transparent)

          subtle:
            $base:
              light: var(--color-notice-200)
              dark:  var(--color-notice-800)
            hovered:
              light: color-mix(in var(--color-space), var(--color-notice-200), var(--color-notice-400) 20%)
              dark:  color-mix(in var(--color-space), var(--color-notice-800), var(--color-notice-600) 20%)
            pressed:
              light: color-mix(in var(--color-space), var(--color-notice-200), var(--color-notice-400) 40%)
