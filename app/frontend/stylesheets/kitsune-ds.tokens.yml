            dark:  color-mix(in display-p3, var(--color-ui-900), var(--color-ui-700) 40%)
          selected:
            light: color-mix(in display-p3, var(--color-ui-100), var(--color-ui-accent-600) 40%)
            dark:  color-mix(in display-p3, var(--color-ui-900), var(--color-ui-accent-500) 40%)
          selected-bold:
            light: var(--color-ui-accent-600)
            dark:  var(--color-ui-accent-500)

        muted:
          $base:
            light: var(--color-ui-200)
            dark:  var(--color-ui-800)
          hovered:
            light: color-mix(in display-p3, var(--color-ui-200), var(--color-ui-400) 20%)
            dark:  color-mix(in display-p3, var(--color-ui-800), var(--color-ui-600) 20%)
          pressed:
