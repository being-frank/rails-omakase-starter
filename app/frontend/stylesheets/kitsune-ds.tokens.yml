            dark:  var(--color-ui-700)
          hovered:
            light: color-mix(in display-p3, var(--color-ui-300), var(--color-ui-500) 20%)
            dark:  color-mix(in display-p3, var(--color-ui-700), var(--color-ui-500) 20%)
          pressed:
