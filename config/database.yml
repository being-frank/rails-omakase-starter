default: &default
  adapter:  postgresql
  encoding: unicode
  pool:     <%= ENV.fetch('RAILS_MAX_THREADS') { 5 } %>

development:
  primary: &primary_development
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>
  cache:
    <<: *primary_development
  queue:
    <<: *primary_development
  cable:
    <<: *primary_development

test:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>
  cache:
    <<: *primary_production
  queue:
    <<: *primary_production
  cable:
    <<: *primary_production

staging:
  primary: &primary_staging
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>
  cache:
    <<: *primary_staging
  queue:
    <<: *primary_staging
  cable:
    <<: *primary_staging
